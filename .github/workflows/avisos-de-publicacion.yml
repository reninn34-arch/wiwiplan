# Reloj de los avisos de publicación.
#
# El plan Hobby de Vercel sólo permite crons diarios, así que la puntualidad
# tiene que venir de afuera. Esto llama al barrido cada 15 minutos: el endpoint
# mira qué piezas ya llegaron a su hora y manda el aviso al teléfono, con la app
# cerrada o abierta, que es el punto de todo el sistema.
#
# Para que funcione hay que cargar dos secretos en el repositorio
# (Settings -> Secrets and variables -> Actions):
#   APP_URL      https://wiwiplan.vercel.app
#   CRON_SECRET  el mismo valor que está en las variables de Vercel
name: Avisos de publicación

on:
  schedule:
    # GitHub interpreta el cron en UTC y puede retrasarse bajo carga; el margen
    # de 12 horas del barrido lo absorbe sin problema.
    - cron: "*/15 * * * *"
  # Para dispararlo a mano desde la pestaña Actions y probar sin esperar.
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar si toca avisar de alguna pieza
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Faltan secretos y sin ellos no se puede avisar de nada."
            echo ""
            echo "Se cargan en: Settings -> Secrets and variables -> Actions"
            echo "  (pestaña 'Secrets', no 'Variables')"
            echo ""
            echo "  APP_URL      https://wiwiplan.vercel.app"
            echo "  CRON_SECRET  el mismo valor que está en las variables de Vercel"
            echo ""
            echo "Hasta entonces esto va a fallar cada 15 minutos. Si necesitas"
            echo "silenciarlo mientras tanto, desactiva el workflow desde Actions."
            exit 1
          fi

          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/publish-reminders/run")

          echo "$respuesta"

          # Un 200 que trae pushDisabled significa que al servidor le faltan las
          # llaves VAPID: se ve como éxito pero no salió ningún aviso.
          case "$respuesta" in
            *pushDisabled*)
              echo "El servidor no tiene las llaves VAPID configuradas."
              exit 1
              ;;
          esac
