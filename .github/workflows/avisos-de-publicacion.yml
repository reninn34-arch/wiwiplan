# Reloj de los avisos de publicación.
#
# El plan Hobby de Vercel sólo permite crons diarios, así que la puntualidad
# tiene que venir de afuera. Esto llama al barrido cada 15 minutos: el endpoint
# mira qué piezas ya llegaron a su hora y manda el aviso al teléfono, con la app
# cerrada o abierta, que es el punto de todo el sistema.
#
# No lleva secretos ni configuración en el repositorio: la URL es pública y el
# endpoint va abierto a propósito (repetir el barrido es idempotente).
name: Avisos de publicación

on:
  schedule:
    # GitHub interpreta el cron en UTC y puede retrasarse bajo carga; el margen
    # de 12 horas del barrido lo absorbe sin problema.
    - cron: "*/15 * * * *"
  # Para dispararlo a mano desde la pestaña Actions y probar sin esperar.
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar si toca avisar de alguna pieza
        run: |
          respuesta=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            "https://wiwiplan.vercel.app/api/publish-reminders/run")

          echo "$respuesta"

          # Un 200 que trae pushDisabled significa que al servidor le faltan las
          # llaves VAPID: se ve como éxito pero no salió ningún aviso.
          case "$respuesta" in
            *pushDisabled*)
              echo "El servidor no tiene las llaves VAPID configuradas."
              exit 1
              ;;
          esac
